# 用法：把 eq.example.com 换成你的域名，然后在仓库根目录执行
#   docker compose -f deploy/docker-compose.yml up -d
services:
  app:
    build:
      context: ../..
      dockerfile: webapp/deploy/Dockerfile
    restart: unless-stopped

  tls:
    image: caddy:2-alpine
    depends_on: [app]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
