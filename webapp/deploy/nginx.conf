# /etc/nginx/sites-available/chu2-webeq
server {
    listen 80;
    listen [::]:80;
    server_name eq.example.com;

    root /var/www/chu2-webeq;
    index index.html;

    # 不要加 Permissions-Policy: hid=() —— 那会把 WebHID 关掉
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 不缓存，改完刷新即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 文件名没有内容哈希，缓存久了会出现「新 HTML + 旧 JS」，所以每次重新校验
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(png|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
